kind = "web"
previewPath = "/"
title = "AI Support Triage Dashboard"
version = "1.0.0"
id = "artifacts/triage-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21860

[services.development]
run = "pnpm --filter @workspace/triage-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/triage-dashboard", "run", "build" ]
publicDir = "artifacts/triage-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21860"
BASE_PATH = "/"
